<script>
    
    
            var map_f64e913fad3ed2d0defc21d394983095 = L.map(
                "map_f64e913fad3ed2d0defc21d394983095",
                {
                    center: [53.902287, 27.561824],
                    crs: L.CRS.EPSG3857,
                    zoom: 13,
                    zoomControl: true,
                    preferCanvas: false,
                }
            );
            function handleMapChanges(event) {
                if(lastSelectedMarker) {
                    lastSelectedMarker.setIcon(defaultIcon);
                    lastSelectedMarker = null;
                }

                var bounds = map_f64e913fad3ed2d0defc21d394983095.getBounds();

                var northWest = bounds.getNorthWest();
                var southEast = bounds.getSouthEast();

                fetch('http://localhost:3001', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        northWest: {
                            lat: northWest.lat,
                            lng: northWest.lng
                        },
                        southEast: {
                            lat: southEast.lat,
                            lng: southEast.lng
                        }
                    })
                });                
            }

            map_f64e913fad3ed2d0defc21d394983095.on('moveend', handleMapChanges);

            map_f64e913fad3ed2d0defc21d394983095.on('click', handleMapChanges);

            function getCenterCoordinates() {
                var center = map_f64e913fad3ed2d0defc21d394983095.getCenter();
                return center.lat + ', ' + center.lng;
            }

            var lastSelectedMarker = null;

            var defaultIcon = new L.Icon.Default();

            var redIcon = new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                shadowSize: [41, 41]
            });

            function sendMarkerName(name) {
                fetch('http://localhost:3001', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name // Используем переданное имя
                    })
                });
            }
